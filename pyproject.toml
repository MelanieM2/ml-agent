[project]
name = "ml-agent"
version = "0.1.0"
description = "Agentic ML experimentation assistant: an LLM orchestrates scikit-learn model search via native function-calling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai==2.10.0",
    "pandas==3.0.3",
    "python-dotenv==1.2.2",
    "scikit-learn==1.9.0",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days ago"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
